name: Deploy Site

on:
  push:
    tags:
      - 'web/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The WebKit suite is the Safari engine contract: the artifact is built,
      # so the runner only has to fetch that engine.
      - run: npx playwright install --with-deps webkit

      - run: npm run test:safari

      # The deck's last rest is a layout contract, not a motion one: the
      # ending must reach the scrollport top when the viewport outgrows the
      # 100svh panels. WebKit is already installed above.
      - run: npm run test:deck

      - run: npm run test:pages

      # The dev server must ship the same document as the artifact; these two
      # runs are what keeps `npm run dev` honest between deploys.
      - run: npm run test:dev

      - run: npm run test:pages:dev
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - run: npm run test:hero
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
